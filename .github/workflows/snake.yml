name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"   # regenerates every 6 hours
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake SVGs (pink/purple palette)
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Rishika-Batra
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#f472b6&color_dots=#1b1b2f,#4c1d95,#7c3aed,#a78bfa,#f472b6
            dist/github-contribution-grid-snake-dark.svg?color_snake=#f472b6&color_dots=#0d0d14,#4c1d95,#7c3aed,#a78bfa,#f472b6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
